<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAFIADAMJ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #161b22;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #d946ef;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            align-items: center;
            background: radial-gradient(circle at 50% 0%, #1a2035 0%, #050505 70%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding-bottom: 80px;
            transition: opacity 0.3s;
        }

        .hidden { display: none !important; }

        /* HEADER */
        header { text-align: center; margin: 20px 0 40px 0; }
        h1 { 
            font-size: 3rem; 
            font-weight: 900; 
            letter-spacing: -2px; 
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        header p { color: var(--accent); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 0.7rem; }

        /* CARDS */
        .glass-card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            height: 55px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            padding: 0 16px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        input:focus { 
            border-color: var(--primary); 
            outline: none; 
        }

        /* BUTTONS */
        button {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            touch-action: manipulation;
        }

        .btn-main {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-main:active { transform: scale(0.96); opacity: 0.9; }

        .btn-back {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .player-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 25px 10px;
            border-radius: 18px;
            text-align: center;
            position: relative;
        }

        .player-box:active { background: rgba(255,255,255,0.1); }
        
        .player-box.disabled {
            opacity: 0.4;
            border: 1px dashed #444;
            pointer-events: none;
        }
        
        .player-box.disabled::after {
            content: "✓";
            position: absolute;
            top: 5px; right: 10px;
            color: var(--success);
            font-weight: 900;
        }

        /* CARD OVERLAY */
        .card-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card-overlay.active { visibility: visible; opacity: 1; }

        .flip-card {
            width: 300px;
            height: 480px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .flip-card.flipped { transform: rotateY(180deg); }

        .flip-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .card-front { background: linear-gradient(135deg, #111 0%, #000 100%); }
        .card-back { transform: rotateY(180deg); text-align: center; }

        /* Role Colors */
        .card-back.role-mafia { border: 2px solid var(--danger); background: linear-gradient(135deg, #300 0%, #100 100%); }
        .card-back.role-cop { border: 2px solid var(--primary); background: linear-gradient(135deg, #002 0%, #001 100%); }
        .card-back.role-doc { border: 2px solid var(--success); background: linear-gradient(135deg, #020 0%, #010 100%); }
        .card-back.role-dama { border: 2px solid var(--accent); background: linear-gradient(135deg, #202 0%, #101 100%); }
        
        .role-icon-big { font-size: 5rem; margin-bottom: 20px; }
        .role-title { font-size: 2rem; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
        .role-desc { font-size: 1rem; color: #ccc; line-height: 1.5; }

        .close-btn {
            margin-top: 30px;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 50px;
            width: auto;
            min-width: 150px;
            font-size: 0.8rem;
        }

        .badge-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .badge { background: #21262d; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; color: #8b949e; }
        
        .checkbox-wrapper {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 15px; border-top: 1px solid #30363d;
        }
        /* FOOTER POTPIS */
        /* UNAPREĐENI FOOTER POTPIS */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 10px; /* Povećan prostor oko teksta */
            text-align: center;
            font-size: 0.9rem; /* Uvećan font */
            color: var(--text); /* Svetlija boja za bolju vidljivost */
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(to top, rgba(5, 5, 5, 1) 40%, transparent 100%);
            pointer-events: none;
            z-index: 100;
        }

        .dev-brand {
            font-weight: 900; /* Extra bold */
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow); /* Blagi sjaj oko imena */
            display: inline-block;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="container" id="screen-1">
        <header>
            <h1>Mafia<span style="color:var(--danger)">.</span>Damj</h1>
            <p>Free Edition</p>
        </header>

        <div class="glass-card">
            <label>Broj Igrača</label>
            <input type="number" id="total" value="6" inputmode="numeric">
            
            <label>Broj Ubica</label>
            <input type="number" id="mafia" value="1" inputmode="numeric">

            <div class="badge-row">
                <div class="badge">🕵️‍♂️ Inspektor</div>
                <div class="badge">💉 Lekar</div>
            </div>

            <div class="checkbox-wrapper">
                <span style="font-weight: 700; color: var(--accent);">Dama u igri? 💋</span>
                <input type="checkbox" id="dama" style="width:25px; height:25px;">
            </div>
        </div>
        <button class="btn-main" onclick="nextPhase()">ZAPOČNI IGRU</button>
    </div>

    <div class="container hidden" id="screen-2">
        <header>
            <h1>Identitet</h1>
            <p>Unos imena agenata</p>
        </header>
        <div id="names-list"></div>
        <button class="btn-main" onclick="assignRoles()">KODIRAJ ULOGE</button>
        <button class="btn-back" onclick="location.reload()">PREKID MISIJE</button>
    </div>

    <div class="container hidden" id="screen-3">
        <header>
            <h1>Dosijei</h1>
            <p>Strogo povarljivo</p>
        </header>
        <div id="player-grid" class="grid"></div>
        <button class="btn-back" style="margin-top: 40px;" onclick="location.reload()">NOVA PARTIJA</button>
    </div>

    <div id="card-overlay" class="card-overlay">
        <div class="flip-card" id="flip-card" onclick="flipCardAction()">
            <div class="flip-face card-front">
                <div style="font-size:3rem; margin-bottom:10px;">👆</div>
                <h3>DODIRNI</h3>
                <p style="color:#666; font-size:0.8rem;">Pristup podacima</p>
            </div>
            <div class="flip-face card-back" id="card-back-content">
                <div class="role-icon-big" id="role-icon"></div>
                <div class="role-title" id="role-name"></div>
                <div class="role-desc" id="role-desc"></div>
                <button class="close-btn" onclick="closeCard(event)">SAKRIJ</button>
            </div>
        </div>
    </div>
    <footer>
    <span class="dev-brand">Damjanovići</span> &copy; 2026
    </footer>
    <script>
        // GLOBALNE PROMENLJIVE
        let gameState = { players: [], activeIdx: null };

        // 1. FAZA: UNOS IMENA
        function nextPhase() {
            // Hvatamo elemente
            const totalEl = document.getElementById('total');
            const mafiaEl = document.getElementById('mafia');
            
            // Provera da li su elementi učitani
            if (!totalEl || !mafiaEl) {
                alert("Greška pri učitavanju. Osvežite stranicu.");
                return;
            }

            const total = parseInt(totalEl.value);
            const mafia = parseInt(mafiaEl.value);

            // Validacija
            if (isNaN(total) || total < 3) {
                alert("Morate uneti bar 3 igrača!");
                return;
            }
            if (mafia >= total) {
                alert("Previše mafije za ovaj broj igrača!");
                return;
            }

            // Generisanje polja
            const list = document.getElementById('names-list');
            list.innerHTML = '';
            for(let i=0; i<total; i++) {
                // Koristimo jednostavniji string metod radi sigurnosti
                list.innerHTML += `<input type="text" class="name-in" placeholder="Igrač ${i+1}" autocomplete="off">`;
            }
            
            // Prebaci ekran
            document.getElementById('screen-1').classList.add('hidden');
            document.getElementById('screen-2').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // 2. FAZA: DODELA ULOGA
        function assignRoles() {
            const total = parseInt(document.getElementById('total').value);
            const mafiaCount = parseInt(document.getElementById('mafia').value);
            const useDama = document.getElementById('dama').checked;
            const inputs = document.getElementsByClassName('name-in');
            
            // Kreiranje špila
            let roles = [];
            roles.push({id: 'role-cop', n: 'INSPEKTOR', i: '🕵️‍♂️', d: 'Saznaj ko je mafija. Proveri jednu osobu svake noći.'});
            roles.push({id: 'role-doc', n: 'LEKAR', i: '💉', d: 'Spasi život. Izaberi koga štitiš noćas od napada.'});
            
            for(let i=0; i<mafiaCount; i++) {
                roles.push({id: 'role-mafia', n: 'MAFIJA', i: '🔪', d: 'Eliminišite građane. Ne dozvoli da te otkriju.'});
            }
            
            if(useDama) {
                roles.push({id: 'role-dama', n: 'DAMA', i: '💋', d: 'Blokiraj moći. Tvoj gost noćas ne radi ništa.'});
            }
            
            while(roles.length < total) {
                roles.push({id: 'role-cit', n: 'GRAĐANIN', i: '👤', d: 'Preživi. Prati ponašanje drugih i glasaj pametno.'});
            }

            // Mešanje (Shuffle)
            for (let i = roles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [roles[i], roles[j]] = [roles[j], roles[i]];
            }

            // Spajanje imena i uloga
            gameState.players = [];
            for(let i=0; i<inputs.length; i++) {
                gameState.players.push({
                    name: inputs[i].value.trim() || `Igrač ${i+1}`,
                    role: roles[i],
                    viewed: false
                });
            }

            renderGrid();
            document.getElementById('screen-2').classList.add('hidden');
            document.getElementById('screen-3').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // PRIKAZ IGRAČA
        function renderGrid() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            
            gameState.players.forEach((p, i) => {
                const box = document.createElement('div');
                box.className = `player-box ${p.viewed ? 'disabled' : ''}`;
                box.innerHTML = `<div style="font-weight:700; font-size: 1.2rem;">${p.name}</div>`;
                
                // Dodajemo onClick samo ako nije pogledano
                if(!p.viewed) {
                    box.onclick = function() { openCardSetup(i); };
                }
                
                grid.appendChild(box);
            });
        }

        // OTVARANJE KARTICE
        function openCardSetup(idx) {
            gameState.activeIdx = idx;
            const p = gameState.players[idx];
            
            // Resetuj flip
            document.getElementById('flip-card').classList.remove('flipped');
            
            // Postavi sadržaj
            const backContent = document.getElementById('card-back-content');
            backContent.className = 'flip-face card-back ' + p.role.id; // Dodaje boju
            
            document.getElementById('role-icon').innerText = p.role.i;
            document.getElementById('role-name').innerText = p.role.n;
            document.getElementById('role-desc').innerText = p.role.d;

            // Prikaži overlay
            document.getElementById('card-overlay').classList.add('active');
        }

        // AKCIJA OKRETANJA
        function flipCardAction() {
            const card = document.getElementById('flip-card');
            if(!card.classList.contains('flipped')) {
                card.classList.add('flipped');
                // Vibracija ako je podržana
                if(navigator.vibrate) navigator.vibrate(50);
            }
        }

        // ZATVARANJE KARTICE
        function closeCard(e) {
            e.stopPropagation(); // Sprečava da se kartica okrene nazad pre zatvaranja
            
            const idx = gameState.activeIdx;
            if(idx !== null) {
                gameState.players[idx].viewed = true;
                renderGrid();
            }
            
            document.getElementById('card-overlay').classList.remove('active');
            
            // Reset za sledeći put (posle animacije)
            setTimeout(() => {
                document.getElementById('flip-card').classList.remove('flipped');
            }, 300);
            
            gameState.activeIdx = null;
        }
    </script>
</body>
</html>
